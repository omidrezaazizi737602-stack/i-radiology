<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آی رادیولوژی | پلتفرم یکپارچه کلینیک‌های رادیولوژی ایران</title>
<style>
@font-face {
  font-family: 'Yekan';
  src: url('https://cdn.jsdelivr.net/gh/rastikerdar/yekan-webfont@v6.0.0/dist/Yekan.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/rastikerdar/yekan-webfont@v6.0.0/dist/Yekan.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Yekan';
  src: url('https://cdn.jsdelivr.net/gh/rastikerdar/yekan-webfont@v6.0.0/dist/YekanBold.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/rastikerdar/yekan-webfont@v6.0.0/dist/YekanBold.woff') format('woff');
  font-weight: bold;
  font-display: swap;
}

:root{
  --brand:#308CF6;
  --brand-dark:#1f6fd6;
  --navy:#0B1E3D;
  --navy-soft:#324567;
  --tint:#EAF2FE;
  --tint2:#F3F8FF;
  --base:#FBFCFE;
  --line:#E2E8F4;
  --teal:#1FB6A8;
  --teal-tint:#E4F7F4;
  --amber:#F6A623;
  --amber-tint:#FDF1DD;
  --red:#E0533D;
  --red-tint:#FBE7E3;
  --shadow: 0 1px 2px rgba(11,30,61,0.04), 0 6px 24px rgba(11,30,61,0.06);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Yekan','Tahoma',sans-serif;
  background:var(--base);
  color:var(--navy);
  direction:rtl;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit; text-decoration:none;}
ul{list-style:none;}

::selection{background:var(--tint); color:var(--brand-dark);}

/* ---------- Layout shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(251,252,254,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  height:72px;
}
.logo{display:flex; align-items:center; gap:10px; font-weight:bold; font-size:19px; cursor:pointer;}
.logo-mark{
  width:36px; height:36px; border-radius:10px;
  background:var(--brand);
  position:relative; overflow:hidden;
  flex-shrink:0;
}
.logo-mark::before{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,0.0) 0px, rgba(255,255,255,0.0) 5px, rgba(255,255,255,0.35) 6px, rgba(255,255,255,0.0) 7px);
}
.logo-mark::after{
  content:''; position:absolute; right:0; left:0; height:2px;
  background:#fff; top:50%;
  box-shadow:0 0 6px rgba(255,255,255,0.8);
  animation: scanmove 2.8s ease-in-out infinite;
}
@keyframes scanmove{
  0%{top:6px; opacity:0.2;} 50%{top:28px; opacity:1;} 100%{top:6px; opacity:0.2;}
}
.nav-links{display:flex; align-items:center; gap:36px;}
.nav-links a{font-size:14.5px; color:var(--navy-soft); transition:color .15s; position:relative; padding:6px 0;}
.nav-links a:hover{color:var(--brand);}
.nav-links a.active{color:var(--brand); font-weight:bold;}
.nav-actions{display:flex; align-items:center; gap:10px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 22px; border-radius:11px; font-size:14.5px; font-weight:bold;
  transition:all .15s; white-space:nowrap;
}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark); transform:translateY(-1px); box-shadow:0 6px 16px rgba(48,140,246,0.3);}
.btn-ghost{background:transparent; color:var(--navy); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--brand); color:var(--brand); background:var(--tint2);}
.btn-sm{padding:8px 16px; font-size:13.5px; border-radius:9px;}
.btn-block{width:100%;}
.btn-soft{background:var(--tint); color:var(--brand-dark);}
.btn-soft:hover{background:#dceaff;}

.mobile-toggle{display:none; font-size:24px; color:var(--navy);}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  padding:72px 0 96px;
  background:linear-gradient(180deg, var(--tint2) 0%, var(--base) 100%);
  overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(180deg, transparent 0, transparent 38px, rgba(48,140,246,0.05) 39px, transparent 40px);
  pointer-events:none;
}
.hero-inner{position:relative; z-index:2; text-align:center;}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--line);
  padding:7px 16px; border-radius:99px; font-size:13px; color:var(--navy-soft);
  margin-bottom:24px; box-shadow:var(--shadow);
}
.eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
.hero h1{
  font-size:46px; line-height:1.32; font-weight:bold; color:var(--navy);
  max-width:780px; margin:0 auto 18px;
}
.hero h1 span{color:var(--brand);}
.hero p{
  font-size:17px; color:var(--navy-soft); max-width:560px; margin:0 auto 40px; line-height:1.8;
}

/* Search card */
.search-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:0 20px 50px rgba(11,30,61,0.10);
  max-width:880px; margin:0 auto; padding:10px; position:relative;
}
.search-tabs{display:flex; gap:4px; padding:8px 8px 4px;}
.search-tab{
  padding:9px 18px; border-radius:9px; font-size:13.5px; color:var(--navy-soft); font-weight:bold;
}
.search-tab.active{background:var(--tint); color:var(--brand-dark);}
.search-row{display:grid; grid-template-columns:1.3fr 1fr 1fr auto; gap:8px; padding:6px 8px 10px;}
.search-field{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  border:1px solid var(--line); border-radius:11px; background:var(--base);
}
.search-field:focus-within{border-color:var(--brand); background:#fff;}
.search-field svg{flex-shrink:0; opacity:0.55;}
.search-field input,.search-field select{border:none; background:none; outline:none; width:100%; font-size:14.5px; color:var(--navy);}
.search-field select{appearance:none; cursor:pointer;}
.search-go{padding:13px 28px;}

.quick-filters{
  display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap;
}
.chip{
  display:flex; align-items:center; gap:7px;
  padding:9px 18px; border-radius:99px; font-size:13.5px; font-weight:bold;
  background:#fff; border:1px solid var(--line); color:var(--navy-soft);
}
.chip:hover{border-color:var(--brand); color:var(--brand);}

/* Stats */
.stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--radius-lg);
  overflow:hidden; margin-top:64px;
}
.stat{background:#fff; padding:30px 20px; text-align:center;}
.stat b{display:block; font-size:30px; color:var(--navy); margin-bottom:4px;}
.stat span{font-size:13.5px; color:var(--navy-soft);}

/* ---------- Section generic ---------- */
.section{padding:80px 0;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:36px; gap:20px;}
.section-head h2{font-size:27px; font-weight:bold; color:var(--navy); margin-bottom:8px;}
.section-head p{font-size:14.5px; color:var(--navy-soft);}
.section-tag{
  font-size:12.5px; font-weight:bold; color:var(--brand); text-transform:uppercase; letter-spacing:0.5px;
  margin-bottom:10px; display:block;
}
.see-all{font-size:14px; font-weight:bold; color:var(--brand); display:flex; align-items:center; gap:6px; white-space:nowrap;}

.bg-tint{background:var(--tint2);}

/* ---------- Clinic Card ---------- */
.carousel{display:flex; gap:20px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x mandatory;}
.carousel::-webkit-scrollbar{height:6px;}
.carousel::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.clinic-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}

.clinic-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg);
  overflow:hidden; transition:all .2s; flex-shrink:0; width:340px; scroll-snap-align:start;
  display:flex; flex-direction:column;
}
.clinic-grid .clinic-card{width:auto;}
.clinic-card:hover{box-shadow:0 16px 36px rgba(11,30,61,0.10); transform:translateY(-3px); border-color:#d3e3fb;}
.clinic-thumb{
  height:160px; position:relative;
  background:linear-gradient(135deg, var(--tint) 0%, #dceaff 100%);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.clinic-thumb svg{width:64px; height:64px; opacity:0.5;}
.clinic-thumb::after{
  content:''; position:absolute; right:0; left:0; height:36px;
  background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 100%);
  bottom:0;
}
.badge-float{
  position:absolute; top:12px; left:12px; background:#fff; padding:5px 11px; border-radius:99px;
  font-size:12px; font-weight:bold; display:flex; align-items:center; gap:5px; box-shadow:var(--shadow); z-index:2;
}
.badge-float.new{color:var(--teal); }
.badge-float.top{color:var(--amber);}
.clinic-body{padding:18px 18px 16px; flex:1; display:flex; flex-direction:column;}
.clinic-name{font-size:16.5px; font-weight:bold; margin-bottom:4px;}
.clinic-meta{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--navy-soft); margin-bottom:12px;}
.clinic-rating{display:flex; align-items:center; gap:5px; font-size:13.5px; font-weight:bold; color:var(--navy); margin-bottom:12px;}
.clinic-rating svg{color:var(--amber);}
.clinic-rating .count{font-weight:normal; color:var(--navy-soft);}
.clinic-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.tag{
  font-size:11.5px; padding:4px 10px; border-radius:7px; background:var(--tint2); color:var(--navy-soft);
  border:1px solid var(--line); font-weight:bold;
}
.clinic-actions{display:flex; gap:8px; margin-top:auto;}
.clinic-actions .btn{flex:1; padding:10px;}

/* ---------- Footer ---------- */
.footer{background:var(--navy); color:#cdd9ef; padding:64px 0 28px; margin-top:auto;}
.footer-grid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:40px; margin-bottom:48px;}
.footer h4{color:#fff; font-size:14.5px; margin-bottom:18px;}
.footer p{font-size:13.5px; line-height:2; color:#9fb0d1;}
.footer ul li{margin-bottom:11px; font-size:13.5px;}
.footer ul li a:hover{color:#fff;}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,0.1); padding-top:24px; display:flex; justify-content:space-between;
  font-size:12.5px; color:#7e8eae; flex-wrap:wrap; gap:10px;
}
.footer-logo{display:flex; align-items:center; gap:9px; font-weight:bold; color:#fff; font-size:17px; margin-bottom:14px;}

/* ---------- Page: Listing ---------- */
.page-head{
  background:var(--tint2); border-bottom:1px solid var(--line); padding:32px 0;
}
.breadcrumb{font-size:13px; color:var(--navy-soft); margin-bottom:10px; display:flex; gap:8px; align-items:center;}
.breadcrumb a:hover{color:var(--brand);}
.page-head h1{font-size:25px; font-weight:bold;}
.page-head .sub{font-size:14px; color:var(--navy-soft); margin-top:4px;}

.listing-layout{display:grid; grid-template-columns:268px 1fr; gap:32px; padding:36px 0 80px;}
.filter-panel{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:22px;
  height:fit-content; position:sticky; top:90px;
}
.filter-panel h3{font-size:15px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between;}
.filter-panel h3 button{font-size:12.5px; color:var(--brand); font-weight:normal;}
.filter-group{margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--line);}
.filter-group:last-child{border:none; margin:0; padding:0;}
.filter-group label.title{font-size:13.5px; font-weight:bold; margin-bottom:12px; display:block;}
.check-row{display:flex; align-items:center; gap:9px; margin-bottom:11px; font-size:13.5px; color:var(--navy-soft); cursor:pointer;}
.check-row input{accent-color:var(--brand); width:16px; height:16px;}
.check-row:hover{color:var(--navy);}
.check-row .num{margin-right:auto; color:var(--navy-soft); font-size:12px;}

.listing-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
.result-count{font-size:14px; color:var(--navy-soft);}
.result-count b{color:var(--navy);}
.sort-select{
  padding:9px 14px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; background:#fff;
}
.listing-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
.listing-grid .clinic-card{width:auto;}
.pagination{display:flex; justify-content:center; gap:8px; margin-top:40px;}
.page-btn{
  width:38px; height:38px; border-radius:9px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:13.5px; font-weight:bold; color:var(--navy-soft);
}
.page-btn.active{background:var(--brand); color:#fff; border-color:var(--brand);}
.page-btn:hover:not(.active){border-color:var(--brand); color:var(--brand);}

/* ---------- Page: Clinic Detail ---------- */
.detail-hero{background:var(--tint2); border-bottom:1px solid var(--line); padding:30px 0 0;}
.detail-top{display:flex; gap:22px; align-items:flex-start; padding-bottom:28px;}
.detail-logo{
  width:84px; height:84px; border-radius:18px; background:#fff; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow);
}
.detail-info h1{font-size:24px; font-weight:bold; margin-bottom:6px;}
.detail-info .row{display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--navy-soft); margin-bottom:12px;}
.detail-info .row span{display:flex; align-items:center; gap:6px;}
.verified{color:var(--teal); display:flex; align-items:center; gap:5px; font-weight:bold; font-size:13px;}
.detail-actions{margin-right:auto; display:flex; gap:10px; flex-shrink:0;}

.tabs-bar{display:flex; gap:6px; border-bottom:1px solid var(--line);}
.tab-btn{
  padding:14px 6px; font-size:14px; font-weight:bold; color:var(--navy-soft); position:relative; margin-left:26px;
}
.tab-btn::after{content:''; position:absolute; bottom:-1px; right:0; left:0; height:2px; background:transparent;}
.tab-btn.active{color:var(--brand);}
.tab-btn.active::after{background:var(--brand);}

.detail-layout{display:grid; grid-template-columns:1fr 360px; gap:32px; padding:36px 0 80px; align-items:start;}
.detail-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:24px; margin-bottom:20px;}
.detail-card h3{font-size:16px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.detail-card p.body-text{font-size:14px; color:var(--navy-soft); line-height:2;}

.equip-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.equip-item{
  border:1px solid var(--line); border-radius:11px; padding:16px 12px; text-align:center;
}
.equip-item svg{margin:0 auto 10px; color:var(--brand);}
.equip-item .name{font-size:13px; font-weight:bold; margin-bottom:3px;}
.equip-item .status{font-size:11.5px; color:var(--teal); font-weight:bold;}

.doctor-row{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);}
.doctor-row:last-child{border:none; padding-bottom:0;}
.doctor-avatar{
  width:52px; height:52px; border-radius:50%; background:var(--tint); display:flex; align-items:center; justify-content:center;
  font-weight:bold; color:var(--brand-dark); font-size:15px; flex-shrink:0;
}
.doctor-info b{display:block; font-size:14.5px; margin-bottom:3px;}
.doctor-info span{font-size:12.5px; color:var(--navy-soft);}

.service-row{display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.service-row:last-child{border:none; padding-bottom:0;}
.service-row .name{font-weight:bold;}
.service-row .desc{color:var(--navy-soft); font-size:12.5px; margin-top:3px;}
.service-row .price{color:var(--brand-dark); font-weight:bold; white-space:nowrap;}

.hours-row{display:flex; justify-content:space-between; padding:9px 0; font-size:13.5px; color:var(--navy-soft);}
.hours-row b{color:var(--navy); font-weight:bold;}
.hours-row.today{color:var(--brand-dark); font-weight:bold;}

.review-item{padding:16px 0; border-bottom:1px solid var(--line);}
.review-item:last-child{border:none;}
.review-head{display:flex; justify-content:space-between; margin-bottom:8px;}
.review-name{font-weight:bold; font-size:14px; display:flex; align-items:center; gap:8px;}
.review-stars{color:var(--amber); font-size:13px;}
.review-date{font-size:12px; color:var(--navy-soft);}
.review-text{font-size:13.5px; color:var(--navy-soft); line-height:1.9;}

.map-embed{
  height:180px; border-radius:11px; background:
    linear-gradient(var(--tint2) 1px, transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg, var(--tint2) 1px, transparent 1px) 0 0/24px 24px,
    #f6f9ff;
  border:1px solid var(--line); position:relative; overflow:hidden; margin-bottom:14px;
}
.map-pin{
  position:absolute; top:50%; right:50%; transform:translate(50%,-100%);
  color:var(--brand); filter:drop-shadow(0 3px 5px rgba(48,140,246,0.4));
}

/* Booking sidebar */
.booking-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:22px;
  position:sticky; top:90px; box-shadow:0 16px 40px rgba(11,30,61,0.07);
}
.booking-card h3{font-size:16.5px; margin-bottom:4px;}
.booking-card .hint{font-size:12.5px; color:var(--navy-soft); margin-bottom:18px;}
.field-label{font-size:13px; font-weight:bold; margin-bottom:8px; display:block;}
.field-block{margin-bottom:18px;}
.select-field{
  width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:13.5px; background:var(--base);
}
.day-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:6px;}
.day-pill{
  text-align:center; padding:10px 4px; border:1px solid var(--line); border-radius:9px; font-size:12px; color:var(--navy-soft);
}
.day-pill b{display:block; font-size:15px; color:var(--navy); margin-top:2px;}
.day-pill.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.day-pill.active b{color:#fff;}
.slot-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.slot{
  text-align:center; padding:10px 4px; border:1px solid var(--line); border-radius:9px; font-size:13px; font-weight:bold; color:var(--navy-soft);
}
.slot.active{background:var(--tint); border-color:var(--brand); color:var(--brand-dark);}
.slot.full{color:#c4cbdb; text-decoration:line-through; background:var(--tint2);}
.price-summary{
  display:flex; justify-content:space-between; padding:14px 0; border-top:1px dashed var(--line); margin-top:6px; font-size:14px;
}
.price-summary b{font-size:17px; color:var(--brand-dark);}

/* ---------- Reservation flow (modal-ish full screen) ---------- */
.flow-screen{min-height:80vh; padding:40px 0 80px;}
.flow-steps{display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:48px;}
.flow-step{display:flex; align-items:center; gap:10px;}
.flow-step .circle{
  width:34px; height:34px; border-radius:50%; background:var(--tint2); border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:bold; color:var(--navy-soft);
}
.flow-step.done .circle{background:var(--teal); border-color:var(--teal); color:#fff;}
.flow-step.active .circle{background:var(--brand); border-color:var(--brand); color:#fff;}
.flow-step .label{font-size:13px; color:var(--navy-soft); font-weight:bold;}
.flow-step.active .label, .flow-step.done .label{color:var(--navy);}
.flow-line{width:60px; height:1.5px; background:var(--line); margin:0 10px;}

.flow-card{
  max-width:620px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:36px; box-shadow:0 16px 40px rgba(11,30,61,0.06);
}

.radio-card{

.radio-card.selected{border-color:var(--brand); background:var(--tint2); color:var(--brand-dark);}
.radio-card input{accent-color:var(--brand);}

.flow-summary{background:var(--tint2); border-radius:12px; padding:18px; margin-bottom:24px;}
.flow-summary-row{display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:var(--navy-soft);}

.flow-nav{display:flex; justify-content:space-between; gap:12px; margin-top:30px;}

.pay-method.selected{border-color:var(--brand); background:var(--tint2);}

.success-screen h2{font-size:22px; margin-bottom:10px;}
.success-screen p{font-size:14px; color:var(--navy-soft); margin-bottom:30px; line-height:1.9;}

.ticket-row span:first-child{color:var(--navy-soft);}

.dash-layout{display:grid; grid-template-columns:240px 1fr; gap:0; min-height:70vh;}
.dash-side{

.dash-profile{display:flex; align-items:center; gap:12px; margin-bottom:28px; padding:0 6px;}

.dash-head h1{font-size:22px;}

.dash-stat .icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;}

.dash-stat span{font-size:12.5px; color:var(--navy-soft);}

function BookingSteps(){
  const labels = ['انتخاب خدمت','تاریخ و ساعت','اطلاعات بیمار','پرداخت'];
  return `
  <div class="flow-steps">
    ${labels.map((l,i)=>{
      const n=i+1;
      const cls = n<state.bookStep?'done':n===state.bookStep?'active':'';
      return `<div class="flow-step ${cls}"><div class="circle">${n<state.bookStep?ic('checkSm'):n}</div><span class="label">${l}</span></div>${i<labels.length-1?'<div class="flow-line"></div>':''}`;
    }).join('')}
  </div>`;
}

      <button class="btn btn-primary" onclick="nav('booking',{bookStep:2})">مرحله بعد ${ic('chevLeft')}</button>

  else if(state.bookStep===2){
    inner = `
    <h2>انتخاب تاریخ و ساعت</h2>
